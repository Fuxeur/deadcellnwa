
name: Build NumWorks NWA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le compilateur ARM
        uses: numworks/setup-arm-toolchain@2020-q2

      - name: Installer Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make

      - name: Compiler le jeu
        run: |
          chmod +x build_nwa.sh
          ./build_nwa.sh

      - name: Récupérer le fichier NWA
        uses: actions/upload-artifact@v4
        with:
          name: jeu-numworks
          path: '**/*.nwa'
          if-no-files-found: error
